<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Reset your Campus Calendar account password."
    >

    <title>Forgot Password | Campus Calendar</title>

    <link rel="stylesheet" href="Styles/forgot-password.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <a href="login.html" class="brand" aria-label="Campus Calendar">

            <img
                src="assets/logo.png"
                alt="Campus Calendar Logo"
                class="brand-logo"
                onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';"
            >

            <div class="fallback-logo" id="fallbackLogo">

                <span class="logo-icon">CC</span>

                <span class="logo-text">
                    <strong>Campus</strong>
                    <strong>Calendar</strong>
                </span>

            </div>

        </a>

        <nav class="header-actions">

            <a href="login.html" class="sign-in-link">
                Sign in
            </a>

            <a href="register.html" class="create-account-button">
                Create account
            </a>

        </nav>

    </header>


    <!-- Main -->
    <main class="main-container">

        <section class="forgot-card">

            <!-- Heading -->
            <div class="forgot-heading">

                <div class="lock-icon" aria-hidden="true">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >

                        <rect
                            x="4"
                            y="10"
                            width="16"
                            height="11"
                            rx="2"
                        />

                        <path
                            d="M8 10V7a4 4 0 0 1 8 0v3"
                        />

                    </svg>

                </div>

                <h1>Forgot Password?</h1>

                <p>
                    Enter your organization Email and we'll send
                    <br class="desktop-break">
                    you a link to reset your password.
                </p>

            </div>


            <!-- Form -->
            <form id="forgotPasswordForm" novalidate>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="sanga@learn.org"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <small
                        class="error-message"
                        id="emailError"
                    ></small>

                </div>


                <!-- Status Message -->
                <div
                    id="formMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    Send reset link
                </button>

            </form>


            <!-- Back to Login -->
            <div class="back-to-login">

                <a href="login.html" class="back-link">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >

                        <path d="M19 12H5"/>

                        <path d="m12 19-7-7 7-7"/>

                    </svg>

                    <span>Back to sign in</span>

                </a>

            </div>

        </section>

    </main>


    <script src="Scripts/forgot-password.js"></script>

</body>

</html>
