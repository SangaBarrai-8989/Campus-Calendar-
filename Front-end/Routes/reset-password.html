<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Campus Calendar</title>
    <link rel="stylesheet" href="../Styles/reset-password.css">
    <link rel="stylesheet" href="../Styles/brand-system.css">
</head>
<body>

    <header class="header">
        <a href="login.html" class="brand">
            <img src="../assets/logo.png" alt="Campus Calendar — Learnistan Techspace" class="brand-logo"
                 onerror="this.style.display='none';document.getElementById('fallbackLogo').style.display='flex';">

            <div class="fallback-logo" id="fallbackLogo">
                <span class="logo-icon">CC</span>
                <span class="logo-text">
                    <strong>Campus</strong>
                    <strong>Calendar</strong>
                </span>
            </div>
        </a>

        <nav class="header-actions">
            <a href="login.html" class="sign-in-link">Sign in</a>
            <a href="register.html" class="create-account-button">Create account</a>
        </nav>
    </header>

    <main class="main-container">
        <section class="reset-card">

            <div class="reset-heading">
                <h1>Reset Password</h1>
                <p>Choose a new password for your account</p>
            </div>

            <form id="resetPasswordForm" novalidate>

                <div class="form-group">
                    <label for="newPassword">New Password</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="Create a new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.7">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <small class="error-message" id="newPasswordError"></small>

                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-track">
                            <span id="strengthBar"></span>
                        </div>
                        <span id="strengthText"></span>
                    </div>

                    <p class="password-hint">
                        Use at least 8 characters, including uppercase,
                        lowercase, and a number.
                    </p>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your new password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.7">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>

                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <div id="formMessage" class="form-message"
                     role="status" aria-live="polite"></div>

                <button type="submit" class="submit-button" id="submitButton">
                    Save new password
                </button>

            </form>

            <div class="back-to-login">
                <a href="login.html">Back to sign in</a>
            </div>

        </section>
    </main>

    <script src="../Scripts/reset-password.js"></script>
</body>
</html>
