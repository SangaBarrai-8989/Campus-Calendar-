<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Back | Learnistan Techspace · Campus Calendar</title>
    <link rel="stylesheet" href="../Styles/welcome-back.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../Styles/brand-system.css">
</head>
<body>

    <main class="welcome-container">
        <section class="welcome-card">

            <div class="logo">
                <img src="../assets/logo.png" alt="Campus Calendar Logo"
                     onerror="this.style.display='none'">
                <span>TechSpace <strong>Campus</strong></span>
            </div>

            <div class="welcome-icon">
                <i class="fa-solid fa-hand-sparkles"></i>
            </div>

            <h1>Welcome Back!</h1>
            <p class="subtitle">
                Your campus life, all in one place.
            </p>

            <div class="user-avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2 id="userName">Student</h2>
            <p class="welcome-message">
                Ready to discover what's happening on campus?
            </p>

            <div class="quick-links">
                <a href="dashboard.html" class="quick-link">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>

                <a href="calendar.html" class="quick-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Campus Calendar</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>

                <a href="events.html" class="quick-link">
                    <i class="fa-solid fa-ticket"></i>
                    <span>Explore Events</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>

                <a href="profile.html" class="quick-link">
                    <i class="fa-solid fa-user-pen"></i>
                    <span>My Profile</span>
                    <i class="fa-solid fa-chevron-right arrow"></i>
                </a>
            </div>

            <a href="dashboard.html" class="continue-btn">
                Continue to Dashboard
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <p class="footer-text">
                Make every campus moment count.
            </p>

        </section>
    </main>

    <script src="../Scripts/welcome-back.js"></script>
</body>
</html>
