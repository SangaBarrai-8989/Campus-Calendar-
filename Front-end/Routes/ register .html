<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create your Campus Calendar account and stay up to date with campus events."
    >

    <title>Create Account | Campus Calendar</title>

    <link rel="stylesheet" href="Styles/register.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <a href="register.html" class="brand" aria-label="Campus Calendar Home">

            <img
                src="assets/logo.png"
                alt="Campus Calendar Logo"
                class="brand-logo"
                onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';"
            >

            <div class="fallback-logo" id="fallbackLogo">
                <span class="logo-icon">CC</span>

                <span class="logo-text">
                    <strong>Campus</strong>
                    <strong>Calendar</strong>
                </span>
            </div>

        </a>

        <nav class="header-actions">

            <a href="login.html" class="sign-in-link">
                Sign in
            </a>

            <a href="register.html" class="create-account-link">
                Create account
            </a>

        </nav>

    </header>


    <!-- Main Content -->
    <main class="main-container">

        <section class="register-card">

            <div class="form-heading">

                <h1>Create your account</h1>

                <p>
                    Join Campus Calendar to stay up to date
                    <br class="desktop-break">
                    with events on campus.
                </p>

            </div>


            <!-- Registration Form -->
            <form id="registerForm" novalidate>

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="sanga@learn.org"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <small class="error-message" id="emailError"></small>

                </div>


                <!-- Organization Email -->
                <div class="form-group">

                    <label for="organizationEmail">
                        Organization email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="organizationEmail"
                            name="organizationEmail"
                            placeholder="sanga@learn.org"
                            autocomplete="organization"
                            required
                        >

                    </div>

                    <small
                        class="error-message"
                        id="organizationEmailError"
                    ></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"
                                />

                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>

                    </div>

                    <small class="error-message" id="passwordError"></small>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.7"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"
                                />

                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>

                    </div>

                    <small
                        class="error-message"
                        id="confirmPasswordError"
                    ></small>

                </div>


                <!-- General Message -->
                <div
                    id="formMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton"
                >
                    Create account
                </button>

            </form>


            <!-- Footer -->
            <div class="form-footer">

                <span>Already have an account?</span>

                <a href="login.html">
                    Sign in
                </a>

            </div>

        </section>

    </main>


    <script src="js/register.js"></script>

</body>
</html>
